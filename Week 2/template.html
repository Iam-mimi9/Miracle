   >
        <form>
            <fieldset>
                <legend>Rate your experience:</legend>
                <rating>

                    type="radio"  
                    name="rating"   
                    value="1"    
                    aria-label="1 Star"    
                    required
                    />
                    <input type="radio" name="rating" value="2" aria-label="2 Stars"/>

                </rating>
            </fieldset>
            <button type="reset">Reset</button>
            <button type="submit">Submit</button>
        </form>
