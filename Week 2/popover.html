
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main class="bg-gray-100" px-20 py-20 text grind place continue>
        <section class="px-20 py-20 text-center">
            <button 
            aria-haspopup="true"
            aria-controls="my-p"
            popovertarget="my-p"
            class="triger-btn bg-white px-4 py-2 border-4 border" 
            >
            Click to know what happened in Nigeria in 1914

            </button>
            <div
            id="my-p"
            popover="manual" 
            class="popover bg-black text-white font-normal py-4 px-4"
            
            >
            <p>In 1914, Southern Nigeria was joined with the Northern. The rest is balablue talk!</p>
            <button aria-label="Close" class="float-right p-1" popovertarget="my-p" popovertargetaction="hide">
                <span aria-hidden="true">Some</span>
            </button>


            </div>

        </section>

    </main>
    
</body>
</html>
